<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="msgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Ambient circles -->
  <circle cx="250" cy="200" r="150" fill="#f0f9ff" />
  <circle cx="250" cy="200" r="110" fill="#e0f2fe" opacity="0.7" />

  <!-- Main Envelope Card -->
  <g transform="translate(150, 140)">
    <!-- Envelope Shadow -->
    <rect x="0" y="0" width="200" height="130" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2.5" filter="drop-shadow(0 15px 30px rgba(56, 189, 248, 0.25))" />
    <!-- Flap Fold -->
    <path d="M0 15 L100 80 L200 15" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M0 130 L75 65" stroke="#bae6fd" stroke-width="2" />
    <path d="M200 130 L125 65" stroke="#bae6fd" stroke-width="2" />
    
    <!-- Instagram Seal on Envelope -->
    <circle cx="100" cy="75" r="22" fill="#0284c7" />
    <rect x="91" y="66" width="18" height="18" rx="5" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="100" cy="75" r="4" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="104.5" cy="70.5" r="1.2" fill="#ffffff" />
  </g>

  <!-- Flying Paper Plane / Send Icon -->
  <g transform="translate(360, 90)">
    <path d="M0 40 L60 0 L25 50 L20 70 L30 55 Z" fill="url(#msgGrad)" filter="drop-shadow(0 6px 12px rgba(2, 132, 199, 0.35))" />
    <path d="M60 0 L25 50" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Chat Bubble 1 (Left Top) -->
  <g transform="translate(70, 70)">
    <rect width="130" height="52" rx="14" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" filter="drop-shadow(0 6px 12px rgba(186, 230, 253, 0.4))" />
    <circle cx="22" cy="26" r="10" fill="#e0f2fe" />
    <text x="22" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">👋</text>
    <text x="40" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Halo Farel!</text>
  </g>

  <!-- Chat Bubble 2 (Right Bottom) -->
  <g transform="translate(290, 280)">
    <rect width="140" height="54" rx="14" fill="#0284c7" filter="drop-shadow(0 6px 14px rgba(2, 132, 199, 0.35))" />
    <text x="70" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Yuk ngobrol santai,</text>
    <text x="70" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle">bisa DM Instagram!</text>
  </g>

  <!-- Dashed flight line -->
  <path d="M250 140 C 310 130, 340 100, 360 90" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 5" fill="none" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative circles -->
  <circle cx="70" cy="90" r="16" fill="#ffffff" opacity="0.3" />
  <circle cx="340" cy="120" r="24" fill="#ffffff" opacity="0.3" />
  <circle cx="320" cy="300" r="12" fill="#ffffff" opacity="0.4" />
  
  <!-- Modern Geometric Accent Rings -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="12 12" opacity="0.5" />

  <g filter="url(#softShadow)">
    <!-- Hoodie Body -->
    <path d="M80 400 C80 300, 130 270, 200 270 C270 270, 320 300, 320 400 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie Collar/Zipper -->
    <path d="M170 275 L200 340 L230 275 Z" fill="#0c4a6e" />
    <path d="M198 340 L198 400" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="175" y="225" width="50" height="55" rx="10" fill="#fbcfe8" />
    <path d="M175 240 Q200 255 225 240 L225 270 Q200 280 175 270 Z" fill="#fdba74" opacity="0.3" />

    <!-- Head & Ears -->
    <circle cx="130" cy="180" r="18" fill="#fed7aa" />
    <circle cx="270" cy="180" r="18" fill="#fed7aa" />
    <ellipse cx="200" cy="175" rx="65" ry="75" fill="url(#skinGrad)" />

    <!-- Modern Haircut -->
    <path d="M135 160 C130 110, 160 85, 200 85 C245 85, 272 105, 268 155 C255 140, 240 135, 220 140 C190 130, 160 140, 135 160 Z" fill="#1e293b" />
    <path d="M133 160 Q138 185 144 195 Q140 165 148 150 Z" fill="#1e293b" />
    <path d="M267 160 Q262 185 256 195 Q260 165 252 150 Z" fill="#1e293b" />

    <!-- Eyes (Friendly & Cheerful) -->
    <circle cx="175" cy="170" r="7" fill="#0f172a" />
    <circle cx="225" cy="170" r="7" fill="#0f172a" />
    <circle cx="177" cy="168" r="2.5" fill="#ffffff" />
    <circle cx="227" cy="168" r="2.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M162 155 Q175 150 188 155" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M212 155 Q225 150 238 155" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M198 175 Q200 185 204 185" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Warm Smile -->
    <path d="M180 198 Q200 220 220 198" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Cheeks blush -->
    <circle cx="160" cy="188" r="9" fill="#f43f5e" opacity="0.25" />
    <circle cx="240" cy="188" r="9" fill="#f43f5e" opacity="0.25" />

    <!-- Stylish Modern Glasses (optional cool tech touch) -->
    <rect x="150" y="156" width="44" height="30" rx="8" fill="none" stroke="#0284c7" stroke-width="3.5" opacity="0.9" />
    <rect x="206" y="156" width="44" height="30" rx="8" fill="none" stroke="#0284c7" stroke-width="3.5" opacity="0.9" />
    <line x1="194" y1="170" x2="206" y2="170" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow elements -->
  <circle cx="300" cy="220" r="180" fill="#e0f2fe" opacity="0.6" />
  <circle cx="480" cy="120" r="60" fill="#bae6fd" opacity="0.5" />
  <circle cx="120" cy="300" r="45" fill="#7dd3fc" opacity="0.4" />

  <!-- Floating UI / Code Card 1 (Left Top) -->
  <g transform="translate(60, 80)">
    <rect width="170" height="90" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(186, 230, 253, 0.5))" />
    <circle cx="20" cy="20" r="5" fill="#f87171" />
    <circle cx="35" cy="20" r="5" fill="#fbbf24" />
    <circle cx="50" cy="20" r="5" fill="#34d399" />
    <rect x="20" y="40" width="80" height="8" rx="4" fill="#38bdf8" />
    <rect x="20" y="56" width="125" height="7" rx="3.5" fill="#94a3b8" opacity="0.5" />
    <rect x="20" y="70" width="95" height="7" rx="3.5" fill="#94a3b8" opacity="0.3" />
  </g>

  <!-- Main Laptop Base & Screen -->
  <!-- Base shadow -->
  <ellipse cx="300" cy="385" rx="210" ry="20" fill="#cbd5e1" opacity="0.4" />

  <!-- Laptop Base Front -->
  <path d="M120 360 L480 360 L450 378 L150 378 Z" fill="#94a3b8" />
  <path d="M140 360 L460 360 L445 372 L155 372 Z" fill="#e2e8f0" />
  <rect x="260" y="362" width="80" height="5" rx="2.5" fill="#64748b" />

  <!-- Laptop Screen Lid -->
  <rect x="150" y="140" width="300" height="215" rx="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="4" />
  <!-- Screen Display -->
  <rect x="162" y="152" width="276" height="185" rx="8" fill="#f8fafc" />

  <!-- Window Header inside laptop -->
  <rect x="162" y="152" width="276" height="28" fill="#e0f2fe" rx="8" />
  <circle cx="178" cy="166" r="4" fill="#ef4444" />
  <circle cx="190" cy="166" r="4" fill="#f59e0b" />
  <circle cx="202" cy="166" r="4" fill="#10b981" />
  <rect x="220" y="161" width="130" height="10" rx="5" fill="#bae6fd" />

  <!-- Code / Design content in screen -->
  <rect x="180" y="195" width="100" height="14" rx="4" fill="#0284c7" />
  <rect x="180" y="218" width="60" height="8" rx="4" fill="#38bdf8" />
  <rect x="250" y="218" width="80" height="8" rx="4" fill="#94a3b8" opacity="0.4" />

  <!-- Mini Chart / Dashboard Graphic on Screen -->
  <rect x="180" y="240" width="115" height="75" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
  <path d="M190 290 Q215 260 235 275 T280 250" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <circle cx="280" cy="250" r="4" fill="#0284c7" />

  <rect x="305" y="240" width="115" height="75" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
  <rect x="315" y="255" width="40" height="6" rx="3" fill="#38bdf8" />
  <rect x="315" y="270" width="80" height="5" rx="2.5" fill="#cbd5e1" />
  <rect x="315" y="282" width="65" height="5" rx="2.5" fill="#cbd5e1" />
  <rect x="315" y="294" width="75" height="5" rx="2.5" fill="#cbd5e1" />

  <!-- Floating UI / Instagram Badge Card 2 (Right Top) -->
  <g transform="translate(400, 70)">
    <rect width="150" height="75" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(56, 189, 248, 0.2))" />
    <circle cx="35" cy="37" r="18" fill="#e0f2fe" />
    <!-- Instagram Camera mini icon -->
    <rect x="26" y="28" width="18" height="18" rx="5" fill="none" stroke="#0284c7" stroke-width="2" />
    <circle cx="35" cy="37" r="4" fill="none" stroke="#0284c7" stroke-width="2" />
    <circle cx="40.5" cy="32.5" r="1.5" fill="#0284c7" />
    <text x="62" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">@f4rreellll</text>
    <text x="62" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#0284c7">Let's connect!</text>
  </g>

  <!-- Floating Sparkles / Creative Icons -->
  <g transform="translate(140, 260)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" />
    <path d="M-6 -2 L0 -8 L6 -2 L0 4 Z" fill="#0284c7" />
  </g>
  <g transform="translate(470, 290)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" />
    <!-- Lightning / Spark -->
    <path d="M-2 -8 L4 -2 L0 0 L3 8 L-4 1 L0 -1 Z" fill="#38bdf8" />
  </g>

  <!-- Coffee Cup on Desk -->
  <g transform="translate(485, 335)">
    <rect x="0" y="10" width="28" height="30" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="2" />
    <path d="M28 16 C34 16 34 26 28 26" fill="none" stroke="#bae6fd" stroke-width="2.5" />
    <path d="M6 5 Q10 0 14 5 Q18 10 22 5" fill="none" stroke="#cbd5e1" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
